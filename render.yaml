services:
  - type: web
    name: nexora-ai-studio-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/main.py
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
